<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #f5a524; } a:hover { color: #ffbd55; }
  </style>
</helmet>

<div style="width: 1200px; height: 780px; display: flex; background: #14171c; color: #dfe4ec; font-size: 13px; overflow: hidden;">

  <div style="width: 190px; flex-shrink: 0; background: #101319; border-right: 1px solid #262c36; display: flex; flex-direction: column;">
    <div style="padding: 18px 16px 20px 16px;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em;">QEMUXPLORER</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 1px; padding: 0 8px;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 4px; color: #97a1b0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Dashboard</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 4px; color: #97a1b0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="4" width="20" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg><span>Machines</span><span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6e7a8b;">12</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 4px; color: #97a1b0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Installations</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 4px; background: #1c2029; color: #ffffff; box-shadow: inset 2px 0 0 #f5a524;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span style="font-weight: 500;">Settings</span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">

    <div style="height: 46px; flex-shrink: 0; border-bottom: 1px solid #262c36; display: flex; align-items: center; padding: 0 16px;">
      <span style="font-size: 14px; font-weight: 600;">Settings</span>
    </div>

    <div style="padding: 20px 16px; display: flex; flex-direction: column; gap: 24px; max-width: 620px;">

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-size: 10px; letter-spacing: 0.1em; color: #6e7a8b;">APPEARANCE</div>
        <div style="display: flex; gap: 10px;">
          <div style="flex-grow: 1; border: 1px solid #3a4250; background: #1f242d; border-radius: 5px; padding: 12px; display: flex; flex-direction: column; gap: 9px;">
            <div style="height: 44px; border-radius: 3px; background: #14171c; border: 1px solid #2a303a; display: flex;">
              <div style="width: 26px; background: #101319; border-right: 1px solid #2a303a;"></div>
              <div style="flex-grow: 1; padding: 6px;"><div style="height: 4px; width: 60%; background: #2e3540; border-radius: 2px;"></div></div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="width: 13px; height: 13px; border-radius: 50%; border: 4px solid #f5a524; box-sizing: border-box;"></span>
              <span style="font-size: 12.5px; color: #ffffff;">Dark</span>
            </div>
          </div>
          <div style="flex-grow: 1; border: 1px solid #2a303a; background: #1a1e26; border-radius: 5px; padding: 12px; display: flex; flex-direction: column; gap: 9px;">
            <div style="height: 44px; border-radius: 3px; background: #f4f4f6; border: 1px solid #d8d8dd; display: flex;">
              <div style="width: 26px; background: #e6e6ea; border-right: 1px solid #d8d8dd;"></div>
              <div style="flex-grow: 1; padding: 6px;"><div style="height: 4px; width: 60%; background: #c9c9d1; border-radius: 2px;"></div></div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="width: 13px; height: 13px; border-radius: 50%; border: 1px solid #4a5260; box-sizing: border-box;"></span>
              <span style="font-size: 12.5px; color: #97a1b0;">Light</span>
            </div>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-size: 10px; letter-spacing: 0.1em; color: #6e7a8b;">DEFAULTS</div>
        <div style="display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 12px 14px; align-items: center;">
          <div style="color: #97a1b0; font-size: 12px;">QEMU binary directory</div>
          <div style="display: flex; gap: 8px;">
            <div style="flex-grow: 1; background: #1a1e26; border: 1px solid #2e3540; border-radius: 4px; padding: 6px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #b6c0cd;">/usr/bin</div>
            <div style="border: 1px solid #2a303a; border-radius: 4px; padding: 6px 11px; color: #97a1b0; font-size: 12px;">Browse</div>
          </div>
          <div style="color: #97a1b0; font-size: 12px;">Attach monitor on start</div>
          <div style="display: flex; align-items: center; gap: 9px;">
            <span style="width: 34px; height: 19px; border-radius: 10px; background: #2a303a; border: 1px solid #3a4250; position: relative; display: inline-block;"><span style="position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #6e7a8b;"></span></span>
            <span style="font-size: 12px; color: #6e7a8b;">Off</span>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-size: 10px; letter-spacing: 0.1em; color: #6e7a8b;">STORAGE</div>
        <div style="background: #1a1e26; border: 1px solid #262c36; border-radius: 5px; padding: 13px 14px; display: flex; align-items: center; gap: 12px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b95a5" stroke-width="1.6" style="flex-shrink: 0;"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/></svg>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #b6c0cd;">~/.qemu_explorer/data.db</span>
            <span style="font-size: 11px; color: #6e7a8b;">Machine definitions and settings</span>
          </div>
          <div style="margin-left: auto; border: 1px solid #2a303a; border-radius: 4px; padding: 5px 11px; color: #97a1b0; font-size: 11.5px; flex-shrink: 0;">Reveal</div>
        </div>
      </div>

    </div>

    <div style="margin-top: auto; height: 26px; flex-shrink: 0; border-top: 1px solid #262c36; background: #101319; display: flex; align-items: center; padding: 0 16px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6e7a8b;">
      <span>changes saved automatically</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
