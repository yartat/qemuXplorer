name: QEMU Explorer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        configuration: [ Release ]

    env:
      SOLUTION: QemuXplorer.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Restore
      run: dotnet restore ${{ env.SOLUTION }}

    - name: Build
      run: dotnet build ${{ env.SOLUTION }} -c ${{ matrix.configuration }} --no-restore

    - name: Test
      run: dotnet test ${{ env.SOLUTION }} -c ${{ matrix.configuration }} --no-build

  # Builds the double-clickable macOS app. It only runs once the build and test job has passed
  # on all three platforms, and it is separate so a packaging problem cannot hide a test result.
  macos-app:
    name: macOS app (${{ matrix.rid }})
    needs: build
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        rid: [ osx-arm64, osx-x64 ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: dotnet publish src/QemuXplorer.App/QemuXplorer.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish/${{ matrix.rid }}

    - name: Build .app
      run: bash tools/build-macos-app.sh publish/${{ matrix.rid }} dist/${{ matrix.rid }} --version 1.0.${{ github.run_number }}

    # ditto keeps the executable bit and the bundle's layout, which a plain zip may not.
    - name: Zip
      run: ditto -c -k --keepParent dist/${{ matrix.rid }}/QemuXplorer.app dist/QemuXplorer-${{ matrix.rid }}.zip

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: QemuXplorer-${{ matrix.rid }}
        path: dist/QemuXplorer-${{ matrix.rid }}.zip
        if-no-files-found: error
