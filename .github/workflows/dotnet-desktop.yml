name: QEMU Explorer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [ Release ]

    runs-on: [windows-latest, ubuntu-latest, macos-latest]

    env:
      Solution_Name: QEmuXlorer.sln
      Test_Project_Path: QEmuXlorer.Core.Tests.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Restore the application to populate the obj folder with RuntimeIdentifiers
    - name: Restore the application
      run: dotnet restore $env:Solution_Name -c $env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    # Publish the application to populate the obj folder with RuntimeIdentifiers
    - name: Publish the application
      run: dotnet publish $env:Solution_Name -c $env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    # Run tests
    - name: Run tests
      run: dotnet test $env:Solution_Name -c $env:Configuration --no-build
      env:
        Configuration: ${{ matrix.configuration }}
